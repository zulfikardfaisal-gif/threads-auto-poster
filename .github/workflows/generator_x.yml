name: Twitter Content Auto Generator

on:
  schedule:
    # 18:30 UTC = Jam 01:30 WIB (Tengah Malam)
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  generate-x-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests gspread google-auth pytz

      - name: Run Content Generator for X
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_CREDS_BASE64: ${{ secrets.GCP_CREDS_BASE64 }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python auto_generator_x.py
